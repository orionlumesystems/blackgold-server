[package]
name = "blackgold-server"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web Framework & Async Runtime
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["cors"] }
futures-util = "0.3"

# Serialization & Database
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls", "postgres", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
anyhow = "1.0"

# Solana SDK & Client
solana-client = "2.1"
solana-sdk = "2.1"
borsh = "1.5"